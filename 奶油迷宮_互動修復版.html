function keyWall(axis,x,y){return `${axis}:${x}:${y}`};function validFloor(f){return f&&Array.isArray(f.walls)&&Array.isArray(f.markers)&&f.walls.every(w=>typeof w==='string'&&/^[hv]:\d+:\d+$/.test(w))&&f.markers.every(m=>m&&Number.isInteger(m.x)&&Number.isInteger(m.y)&&m.x>=1&&m.x<=COLS&&m.y>=1&&m.y<=ROWS&&['stairs','holeFloor','holeCeiling','item'].includes(m.type))}

function edge(axis,x,y){let a=axis==='v'?{x1:x*S,y1:y*S,x2:x*S,y2:(y+1)*S}:{x1:x*S,y1:y*S,x2:(x+1)*S,y2:y*S};let hit=el('line',{...a,class:'edge-hit'});hit.addEventListener('click',()=>{snapshot();const k=keyWall(axis,x,y),arr=floors[current].walls,idx=arr.indexOf(k);if(idx>=0)arr.splice(idx,1);else arr.push(k);render();message(`${current+1}F ${idx>=0?'移除':'新增'}牆壁 ${k}`)});map.append(hit)}
function transform(){wrap.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${scale})`}function zoom(f){scale=Math.max(.45,Math.min(2.8,scale*f));transform()}function setMode(on){editing=on;document.getElementById('browse').classList.toggle('active',!on);document.getElementById('edit').classList.toggle('active',on);document.getElementById('editor').classList.toggle('open',on);document.getElementById('help').innerHTML=on?'選擇工具，點擊格線或格子修改。<br>編輯內容可匯出 JSON。':'拖曳移動地圖，按右下角按鈕縮放。<br>格線永遠顯示。';render()}

document.getElementById('undo').onclick=()=>{if(!undoStack.length)return message('沒有可復原的操作');redoStack.push(JSON.stringify(floors));floors=JSON.parse(undoStack.pop());render();message('已復原')};document.getElementById('redo').onclick=()=>{if(!redoStack.length)return message('沒有可重做的操作');undoStack.push(JSON.stringify(floors));floors=JSON.parse(redoStack.pop());render();message('已重做')};document.getElementById('save').onclick=()=>{const data={version:1,columns:COLS,rows:ROWS,coordinate:'x-left-to-right,y-bottom-to-top',floors};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='奶油迷宮_地圖資料.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);message('已匯出三層樓地圖資料')};document.getElementById('load').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.columns!==COLS||d.rows!==ROWS||!Array.isArray(d.floors)||d.floors.length!==3||!d.floors.every(validFloor))throw Error('檔案格式或地圖尺寸不符');snapshot();floors=d.floors.map(fl=>({walls:[...new Set(fl.walls)].filter(w=>{let[a,x,y]=w.split(':');x=+x;y=+y;return a==='v'?x<=COLS&&y<ROWS:x<COLS&&y<=ROWS}),markers:fl.markers}));render();message('已成功匯入三層樓資料')}catch(err){message('匯入失敗：'+err.message)}e.target.value=''};
let dragging=null;canvas.addEventListener('pointerdown',e=>{if(editing||e.button!==0)return;dragging={x:e.clientX,y:e.clientY,dx,dy,id:e.pointerId};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!dragging||dragging.id!==e.pointerId)return;dx=dragging.dx+e.clientX-dragging.x;dy=dragging.dy+e.clientY-dragging.y;transform()});canvas.addEventListener('pointerup',()=>dragging=null);canvas.addEventListener('pointercancel',()=>dragging=null);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:1/1.1)},{passive:false});render();transform();
